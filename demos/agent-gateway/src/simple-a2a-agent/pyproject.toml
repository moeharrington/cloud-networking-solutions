[project]
name = "simple-a2a-agent"
version = "0.1.0"
description = "Minimal ADK A2A agent for Agent Runtime"
requires-python = ">=3.12,<3.14"
dependencies = [
    "google-adk[gcp]>=2.0.0,<3.0.0",
    "a2a-sdk[http-server]>=0.3.26,<0.4.0",
    "uvicorn>=0.34.0,<1.0.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1,<1.0.0",
    "ruff>=0.8.0,<1.0.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

