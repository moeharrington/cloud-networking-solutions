[project]
name = "mortgage-agent"
version = "0.1.0"
description = "ADK mortgage assistant agent with Agent Gateway MCP connections"
requires-python = ">=3.12"
dependencies = [
    "google-adk[gcp,agent-identity]>=2.0.0,<3.0.0",
    "a2a-sdk[http-server]>=0.3.26,<0.4.0",
    "google-cloud-aiplatform[agent_engines]>=1.149.0",
    "googleapis-common-protos[grpc]>=1.70.0",
    "mcp>=1.27.0,<2.0.0",
    "tzdata>=2025.2",
    "uvicorn>=0.34.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8.0",
    "ty>=0.0.1a0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
